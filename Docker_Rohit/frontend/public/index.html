<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>To-Do Application</h1>

        <form id="todoForm">

            <label for="itemName">
                Item Name
            </label>

            <input
                type="text"
                id="itemName"
                name="itemName"
                required
            >

            <label for="itemDescription">
                Item Description
            </label>

            <textarea
                id="itemDescription"
                name="itemDescription"
                required
            ></textarea>

            <button type="submit">
                Submit To-Do
            </button>

        </form>

        <div id="result"></div>

    </div>

    <script>

        document
            .getElementById("todoForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const itemName =
                    document.getElementById("itemName").value;

                const itemDescription =
                    document.getElementById("itemDescription").value;

                try {

                    const response = await fetch("/submit", {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            itemName,
                            itemDescription
                        })

                    });

                    const data = await response.json();

                    document.getElementById("result").innerText =
                        JSON.stringify(data, null, 2);

                } catch (error) {

                    document.getElementById("result").innerText =
                        "Error submitting To-Do";

                }

            });

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flask & MongoDB Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {
            background: #ffe6e6;
            color: #cc0000;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .api-link {
            text-align: center;
            margin-top: 20px;
        }

        .api-link a {
            color: #007bff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Flask & MongoDB</h1>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form action="/submit" method="POST">

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                name="name"
                value="{{ name or '' }}"
                placeholder="Enter your name"
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                value="{{ email or '' }}"
                placeholder="Enter your email"
            >

            <label for="message">Message</label>

            <textarea
                id="message"
                name="message"
                placeholder="Enter your message"
            >{{ message or '' }}</textarea>

            <button type="submit">
                Submit Data
            </button>

        </form>

        <div class="api-link">
            <p>
                Test JSON API:
                <a href="/api" target="_blank">
                    Open /api
                </a>
            </p>
        </div>

    </div>

</body>

</html>
